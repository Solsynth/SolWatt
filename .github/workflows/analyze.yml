name: Flutter Analyze

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Retry + HTTP/1.1: git deps clone from src.solsynth.dev behind
      # Cloudflare, which intermittently resets large pack transfers (curl 56).
      - name: flutter pub get
        shell: bash
        run: |
          git config --global http.version HTTP/1.1
          for attempt in 1 2 3; do
            flutter pub get && break
            echo "flutter pub get failed (attempt $attempt); retrying in 10s"
            sleep 10
          done
      # The Solian packages resolve from the git remote here. A lockfile
      # pointing at a sibling checkout only exists on a developer machine
      # (pubspec_overrides.yaml is gitignored) and would re-resolve against
      # floating revisions on CI, so fail the pull request instead.
      - name: Check the lockfile came from the git sources
        run: git diff --exit-code -- pubspec.lock
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze lib
