name: solwatt
description: The Solar Network workspaces app
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+4

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Shared desktop frame, responsive helpers, and UI primitives.
  island_ui_foundation:
    git:
      url: https://src.solsynth.dev/SoSYS/Solian.git
      path: packages/island_ui_foundation
      # Every Solian package is pinned to one revision. Pub identifies a git
      # dependency by url + path + ref, and these packages depend on each other
      # by path inside that checkout, so a floating HEAD resolves one package
      # from two sources ("at HEAD" vs "at <commit>") and version solving fails.
      # Bump all three refs together.
      ref: 4d8de432ff1f5a9cc02796226fc45b4fdba73b56
  # The island_ui_foundation window frame renders with this Material fork's
  # widgets; theme it directly so the titlebar follows the app theme.
  material_ui: ^1.5.0
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.4.3
  window_manager:
    git:
      url: https://github.com/boyan01/window_manager.git
      path: packages/window_manager
      ref: 6fae92d21b4c80ce1b8f71c1190d7970cf722bd4

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^2.0.0
  auto_route: ^11.2.0
  freezed_annotation: ^3.1.0
  material_symbols_icons: ^4.2960.0
  dio: ^5.11.1
  crypto: ^3.0.7
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  logging: ^1.3.0
  path_provider: ^2.1.6
  solar_network_sdk:
    git:
      url: https://src.solsynth.dev/SoSYS/Solian.git
      path: packages/solar_network_sdk
      ref: 4d8de432ff1f5a9cc02796226fc45b4fdba73b56
  solar_network_foundation:
    git:
      url: https://src.solsynth.dev/SoSYS/Solian.git
      path: packages/solar_network_foundation
      ref: 4d8de432ff1f5a9cc02796226fc45b4fdba73b56
  file_picker: ^13.1.0
  http_parser: ^4.1.2
  # Mail bodies arrive as HTML. The dark-mode contrast pass rewrites inline
  # colours in place, which needs a real parse rather than a regex.
  html: ^0.15.7
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  web_socket_channel: ^3.0.3
  easy_localization: ^3.0.8
  flutter_native_splash: ^2.4.8
  flutter_quill: ^11.6.0
  flutter_quill_delta_from_html: ^1.5.3
  vsc_quill_delta_to_html: ^1.0.5
  flutter_inappwebview: ^6.1.5
  super_context_menu: ^0.10.0-dev.2
  file_saver: ^0.6.0
  # Push notifications (Android/iOS/macOS): FCM token registration with the
  # Solar Network Metoer gateway, mirroring MaidKit's maidcafe_push service.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1

  # --- Drive (ported from Solian lib/drive, workspace-scoped) ---
  animations: ^3.0.0
  # Pinned to the 4.x line that solar_network_foundation (Solian) requires:
  # it renders through the material_ui fork this app already depends on.
  cached_network_image: ^4.0.4
  collection: ^1.19.1
  convert: ^3.1.2
  desktop_drop: ^0.8.4
  dismissible_page: ^1.0.2
  flutter_blurhash: ^0.9.1
  flutter_cache_manager: ^3.4.5
  flutter_image_compress: ^2.5.1
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  gal: ^2.3.3
  image: ^4.10.1
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  mime: ^2.1.0
  native_exif: ^0.8.0
  path: ^1.9.1
  photo_view: ^0.15.0
  pointycastle: ^4.0.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  skeletonizer: ^3.0.0
  styled_widget: ^0.4.1
  super_sliver_list: ^0.4.1
  video_thumbnail: ^0.5.6
  visibility_detector: ^0.4.0+2
  cross_file: ^0.3.5+5
  shared_preferences: ^2.5.5
  web: ^1.1.1
  relative_time: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  auto_route_generator: ^10.6.0
  freezed: ^4.0.1
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/flywheel/maidkit.png
    - assets/images/media-offline.webp
    - assets/icons/icon.png
    - assets/icons/app-icon-default.png
    - assets/icons/app-icon-cuite.png
    - assets/i18n/en-US.json
    - assets/i18n/zh-CN.json

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/icon.png"
  min_sdk_android: 21
  image_path_ios_dark_transparent: "assets/icons/icon-dark.png"
  remove_alpha_ios: true
  desaturate_tinted_to_grayscale_ios: true
  background_color_ios: "#ffffff"
  web:
    generate: true
    image_path: "assets/icons/icon.png"
    background_color: "#ffffff"
    theme_color: "#f2be53"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/icon-padded.png"

flutter_native_splash:
  image: "assets/icons/icon.png"
  image_dark: "assets/icons/icon-dark.png"
  color: "#ffffff"
  color_dark: "#121212"
